[functions]
0x820DE058 = {} # prevents the game from starting
0x8236A7E0 = {} # crashes after starting a new game
0x82661258 = {} # crashes after starting a new game
0x8227C710 = {} # crashes after the first elevator
0x8279FAC8 = {} # crashes after first shootout

# Direct look-velocity injection.  sub_823F8AF0 is the player pawn's
# per-frame look-input -> rotation-velocity update (r3 = pawn).  The hook
# overwrites the two look-velocity input floats (pawn+0x227C = yaw,
# pawn+0x2280 = pitch, +/-255 range) with the mouse delta before they are
# consumed, bypassing the entire analog-stick pipeline while keeping the
# engine's own rot-velocity easing/friction.  See
# src/hooks/camera_mouselook_hook.cpp.
[[midasm_hook]]
address = 0x823F8AF0
name = "PlayerLookVelocityHook"
registers = ["r3"]
after_instruction = false
